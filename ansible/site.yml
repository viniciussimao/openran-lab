---
# Playbook principal do openran-lab.
# O Vagrant coloca cada VM num grupo com o próprio nome (ran, obs, smo).

- name: Base comum a todas as VMs
  hosts: all
  become: true
  roles:
    - common
    - docker

# Etapa 1: a ordem segue docs/stages/01-ran-core-e2.md. O oai_ran clona o
# OAI, de onde o flexric (submódulo) e o oai_cn5g (arquivos do core) saem.
- name: RAN, core 5G e Near-RT RIC
  hosts: ran
  become: true
  roles:
    - oai_ran
    - flexric
    - oai_cn5g
