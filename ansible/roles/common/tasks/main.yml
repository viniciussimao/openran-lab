---
# Role common: ajustes de base em todas as VMs.

- name: Configurar rede e DNS
  ansible.builtin.import_tasks: dns.yml

- name: Estender o disco
  ansible.builtin.import_tasks: disk.yml

- name: Instalar pacotes base
  ansible.builtin.import_tasks: packages.yml

- name: Criar o diretório de estado do laboratório
  ansible.builtin.file:
    path: "{{ lab_state_dir }}"
    state: directory
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0755"
