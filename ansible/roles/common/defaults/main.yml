---
# Servidor DNS das VMs. O Vagrantfile passa o dnsmasq do libvirt
# (primeiro endereço da rede de gerenciamento) via extra_vars.
common_dns_server: 192.168.121.1

# Nome usado para testar a resolução de DNS
common_dns_probe_host: github.com

# Interface de rede de gerenciamento da VM
common_mgmt_interface: eth0

# Volume LVM da box Ubuntu, estendido para ocupar todo o disco
common_lvm_vg: ubuntu-vg
common_lvm_lv: ubuntu-lv

# Atualizar todos os pacotes no primeiro provisionamento
common_apt_upgrade: true

# Pacotes base usados nas etapas seguintes
common_base_packages:
  - build-essential
  - ca-certificates
  - cmake
  - cmake-curses-gui
  - curl
  - git
  - iperf3
  - libpcre2-dev
  - libsctp-dev
  - net-tools
  - ninja-build
  - python3
  - python3-dev
  - tmux
