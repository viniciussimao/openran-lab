---
# Role docker: instala o Docker Engine a partir do repositório oficial.
# Usado pelo OAI CN5G e, nas etapas seguintes, pelos serviços do laboratório.

- name: Criar diretório de chaves do apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Baixar a chave GPG da Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Adicionar o repositório da Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present

- name: Instalar o Docker Engine e o Compose
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Garantir que o Docker está ativo
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Permitir o uso do Docker sem sudo
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
