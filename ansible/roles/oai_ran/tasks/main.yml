---
# Role oai_ran: clona o OAI na versão fixa e compila gNB e nrUE com o
# agente E2 (passos 1 e 2 de docs/stages/01-ran-core-e2.md).
# Tudo roda como o lab_user; só o build_oai -I usa sudo internamente.

- name: Clonar o OAI na tag fixa
  ansible.builtin.git:
    repo: "{{ oai_repo_url }}"
    dest: "{{ oai_src_dir }}"
    version: "{{ oai_version }}"
    # Não mexe num clone existente; o commit é conferido logo abaixo
    update: false
  become: true
  become_user: "{{ lab_user }}"

# O módulo git não lê o commit de um clone sem tentar atualizá-lo
- name: Ler o commit do clone do OAI
  ansible.builtin.command: git -C {{ oai_src_dir }} rev-parse HEAD # noqa: command-instead-of-module
  register: oai_ran_head
  changed_when: false
  become: true
  become_user: "{{ lab_user }}"

# Etapa 2: com oai_slice_scheduler_enabled, o commit esperado é o do fork;
# sem, o da tag. Trocar de um para o outro só acontece com o clone limpo,
# para não perder mudanças locais.
- name: Pôr o clone do OAI no commit esperado
  when: oai_ran_head.stdout | trim != oai_ran_commit
  become: true
  become_user: "{{ lab_user }}"
  block:
    - name: Ler as mudanças locais do clone do OAI
      ansible.builtin.command: git -C {{ oai_src_dir }} status --porcelain --untracked-files=no # noqa: command-instead-of-module
      register: oai_ran_dirty
      changed_when: false

    - name: Conferir se o clone do OAI está limpo
      ansible.builtin.assert:
        that:
          - oai_ran_dirty.stdout | trim | length == 0
        fail_msg: >-
          O clone em {{ oai_src_dir }} está no commit {{ oai_ran_head.stdout | trim }}
          e tem mudanças locais. O esperado é {{ oai_ran_commit }}.
          Guarde ou descarte as mudanças e provisione de novo.
        quiet: true

    - name: Ler o remoto do fork no clone do OAI
      ansible.builtin.command: git -C {{ oai_src_dir }} remote get-url {{ oai_ran_fork_remote }} # noqa: command-instead-of-module
      register: oai_ran_fork_url
      changed_when: false
      failed_when: false
      when: oai_slice_scheduler_enabled | bool

    - name: Configurar o remoto do fork no clone do OAI
      ansible.builtin.command: >- # noqa: command-instead-of-module
        git -C {{ oai_src_dir }} remote
        {{ 'set-url' if oai_ran_fork_url.rc == 0 else 'add' }}
        {{ oai_ran_fork_remote }} {{ oai_fork_repo_url }}
      changed_when: true
      when:
        - oai_slice_scheduler_enabled | bool
        - oai_ran_fork_url.stdout | default('') | trim != oai_fork_repo_url

    - name: Baixar a branch do fork
      ansible.builtin.command: git -C {{ oai_src_dir }} fetch {{ oai_ran_fork_remote }} {{ oai_fork_branch }} # noqa: command-instead-of-module
      changed_when: true
      when: oai_slice_scheduler_enabled | bool

    - name: Fazer o checkout do commit esperado
      ansible.builtin.command: git -C {{ oai_src_dir }} checkout --detach {{ oai_ran_commit }} # noqa: command-instead-of-module
      changed_when: true

    # Outro nome: uma task pulada com register apagaria o oai_ran_head
    - name: Ler de novo o commit do clone do OAI
      ansible.builtin.command: git -C {{ oai_src_dir }} rev-parse HEAD # noqa: command-instead-of-module
      register: oai_ran_head_new
      changed_when: false

- name: Conferir se o clone está no commit fixo
  ansible.builtin.assert:
    that:
      - oai_ran_head_new.stdout | default(oai_ran_head.stdout) | trim == oai_ran_commit
    fail_msg: >-
      O clone em {{ oai_src_dir }} está no commit {{ oai_ran_head_new.stdout | default(oai_ran_head.stdout) | trim }},
      mas o esperado é {{ oai_ran_commit }}
      ({{ 'branch ' ~ oai_fork_branch ~ ' do fork' if oai_slice_scheduler_enabled | bool else 'tag ' ~ oai_version }}).
    quiet: true

# O módulo git só inicia todos os submódulos (recursive); aqui basta o FlexRIC
- name: Iniciar o submódulo do FlexRIC
  ansible.builtin.command: # noqa: command-instead-of-module
    cmd: git submodule update --init openair2/E2AP/flexric
    chdir: "{{ oai_src_dir }}"
  register: oai_ran_submodule
  # Sem saída quando o submódulo já está no commit certo
  changed_when: (oai_ran_submodule.stdout ~ oai_ran_submodule.stderr) | trim | length > 0
  become: true
  become_user: "{{ lab_user }}"

- name: Verificar os binários do OAI
  ansible.builtin.stat:
    path: "{{ oai_ran_build_dir }}/{{ item }}"
  loop: "{{ oai_ran_binaries }}"
  register: oai_ran_binaries_stat

- name: Ler o registro do último build do OAI
  ansible.builtin.slurp:
    src: "{{ oai_ran_build_stamp }}"
  register: oai_ran_stamp_current
  failed_when: false

# VMs provisionadas antes do diretório de estado têm o registro no
# diretório de build. Ele é aproveitado (se ainda não houver registro novo)
# e apagado.
- name: Ler o registro antigo do OAI
  ansible.builtin.slurp:
    src: "{{ oai_ran_legacy_build_stamp }}"
  register: oai_ran_stamp_legacy
  failed_when: false

- name: Apagar o registro antigo do diretório de build
  ansible.builtin.file:
    path: "{{ oai_ran_legacy_build_stamp }}"
    state: absent

- name: Decidir se o OAI precisa ser compilado
  ansible.builtin.set_fact:
    oai_ran_build_needed: >-
      {{ (oai_ran_binaries_stat.results | rejectattr('stat.exists') | list | length > 0)
         or ((oai_ran_stamp_current.content | default(oai_ran_stamp_legacy.content | default('')) | b64decode | trim)
             != oai_ran_build_id) }}

- name: Migrar o registro antigo para o diretório de estado
  ansible.builtin.copy:
    dest: "{{ oai_ran_build_stamp }}"
    content: "{{ oai_ran_build_id }}\n"
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0644"
  when:
    - not (oai_ran_build_needed | bool)
    - oai_ran_stamp_current.content is not defined

- name: Compilar o OAI
  when: oai_ran_build_needed | bool
  become: true
  become_user: "{{ lab_user }}"
  environment:
    DEBIAN_FRONTEND: noninteractive
  block:
    - name: Instalar as dependências do OAI (build_oai -I)
      ansible.builtin.command:
        cmd: ./build_oai -I
        chdir: "{{ oai_src_dir }}/cmake_targets"
      async: "{{ oai_ran_deps_timeout }}"
      poll: "{{ oai_ran_poll_interval }}"
      changed_when: true

    - name: Compilar gNB e nrUE com o agente E2
      ansible.builtin.command:
        cmd: >-
          ./build_oai -w SIMU --gNB --nrUE --build-e2 --ninja
          --cmake-opt -DE2AP_VERSION={{ e2ap_version }}
          --cmake-opt -DKPM_VERSION={{ kpm_version }}
        chdir: "{{ oai_src_dir }}/cmake_targets"
      async: "{{ oai_ran_build_timeout }}"
      poll: "{{ oai_ran_poll_interval }}"
      changed_when: true

    - name: Registrar o commit e as opções do build
      ansible.builtin.copy:
        dest: "{{ oai_ran_build_stamp }}"
        content: "{{ oai_ran_build_id }}\n"
        mode: "0644"

- name: Copiar as configurações do nrUE para a home do lab_user
  ansible.builtin.copy:
    src: "{{ oai_ran_configs_dir }}/{{ item }}"
    dest: "{{ lab_home }}/{{ item }}"
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0644"
  loop: "{{ oai_ran_ue_confs }}"

- name: Copiar os scripts da Etapa 2 para a home do lab_user
  ansible.builtin.copy:
    src: "{{ oai_ran_scripts_dir }}/{{ item }}"
    dest: "{{ lab_home }}/{{ item }}"
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0755"
  loop: "{{ oai_ran_scripts }}"

# Etapa 2: o arquivo do OAI não é versionado no openran-lab; a cópia na
# home recebe só a snssaiList com os slices de lab_slices
- name: Ler a configuração do gNB da Etapa 1
  ansible.builtin.slurp:
    src: "{{ oai_ran_gnb_conf_src }}"
  register: oai_ran_gnb_conf_raw

- name: Guardar a configuração do gNB da Etapa 1
  ansible.builtin.set_fact:
    oai_ran_gnb_conf: "{{ oai_ran_gnb_conf_raw.content | b64decode }}"

- name: Conferir a snssaiList na configuração do gNB
  ansible.builtin.assert:
    that:
      - (oai_ran_gnb_conf.split(oai_ran_gnb_snssai_upstream) | length) == 2
    fail_msg: >-
      "{{ oai_ran_gnb_snssai_upstream }}" deveria aparecer uma única vez em
      {{ oai_ran_gnb_conf_src }}. A configuração do OAI mudou: revise
      oai_ran_gnb_snssai_upstream.
    quiet: true

- name: Gerar a configuração do gNB com os slices do laboratório
  ansible.builtin.template:
    src: gnb-slices.conf.j2
    dest: "{{ oai_ran_gnb_slices_conf }}"
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0644"

# Etapa 2, com o escalonador do fork: uma configuração do gNB por perfil de
# cotas (oai_ran_gnb_quota_profiles), a partir do ~/gnb-slices.conf
- name: Conferir a linha de inserção das cotas na configuração do gNB
  ansible.builtin.assert:
    that:
      - (oai_ran_gnb_conf.split(oai_ran_gnb_policy_anchor) | length) == 2
    fail_msg: >-
      "{{ oai_ran_gnb_policy_anchor }}" deveria aparecer uma única vez, dentro
      de MACRLCs, em {{ oai_ran_gnb_conf_src }}. A configuração do OAI mudou:
      revise oai_ran_gnb_policy_anchor.
    quiet: true
  when: oai_slice_scheduler_enabled | bool

- name: Conferir os slices dos perfis de cotas
  ansible.builtin.assert:
    that:
      - item.quotas | length > 0
      - item.quotas.keys() | difference(lab_slices | map(attribute='name')) | length == 0
    fail_msg: >-
      O perfil "{{ item.name }}" de oai_ran_gnb_quota_profiles precisa de pelo
      menos uma cota, e cada cota tem de usar o nome de um slice de lab_slices.
    quiet: true
  loop: "{{ oai_ran_gnb_quota_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  when: oai_slice_scheduler_enabled | bool

- name: Gerar as configurações do gNB com as cotas por slice
  ansible.builtin.template:
    src: gnb-slices-quota.conf.j2
    dest: "{{ lab_home }}/gnb-slices-{{ item.name }}.conf"
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0644"
  loop: "{{ oai_ran_gnb_quota_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  when: oai_slice_scheduler_enabled | bool
