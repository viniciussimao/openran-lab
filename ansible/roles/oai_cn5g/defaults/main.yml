---
# Arquivos do core no repositório do OAI (clonado pela role oai_ran)
oai_cn5g_src_dir: "{{ oai_src_dir }}/doc/tutorial_resources/oai-cn5g"

# Cópia de trabalho na home do lab_user, onde o docker compose roda
oai_cn5g_dir: "{{ lab_home }}/oai-cn5g"

# Nomes aceitos para o arquivo principal do compose
oai_cn5g_compose_names:
  - docker-compose.yaml
  - docker-compose.yml
  - compose.yaml
  - compose.yml

# Tempo máximo para baixar as imagens e esperar os containers ficarem
# saudáveis, em segundos (async/poll)
oai_cn5g_up_timeout: 1800
oai_cn5g_wait_timeout: 600
oai_cn5g_poll_interval: 15

# Etapa 2: config.yaml do core com os slices de lab_slices (group_vars).
# É gerado em conf/ ao lado do original do OAI, que fica intacto, e montado
# no lugar dele em cada NF pelo override do compose.
oai_cn5g_config_src: "{{ oai_cn5g_dir }}/conf/config.yaml"
oai_cn5g_lab_config_name: config.lab.yaml

# QoS das assinaturas locais do SMF para os slices do laboratório (iguais
# às do DNN "oai" no config.yaml do OAI)
oai_cn5g_lab_5qi: 9
oai_cn5g_lab_session_ambr: "10Gbps"

# Cabeçalhos do config.yaml do OAI depois dos quais os slices são
# inseridos. A role confere que cada um aparece uma única vez.
oai_cn5g_config_headers:
  snssais: "\nsnssais:\n"
  amf_nssai: "\n      nssai:\n"
  smf_info: "\n    sNssaiSmfInfoList:\n"
  smf_subscriptions: "\n  local_subscription_infos:\n"
  upf_info: "\n    sNssaiUpfInfoList:\n"
