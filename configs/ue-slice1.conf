# Configuração do nrUE do slice 1 do openran-lab (Etapa 2).
# A role oai_ran copia este arquivo para ~/ue-slice1.conf na VM ran. O UE roda
# num namespace próprio (scripts/multi-ue-ns.sh) com "-O ~/ue-slice1.conf".
# IMSI, chave e OPc são os valores de teste públicos do tutorial do OAI
# CN5G, já cadastrados no banco do core: não são segredos.
# O S-NSSAI (nssai_sst, nssai_sd) tem de bater com slice1 de lab_slices em
# ansible/group_vars/all.yml. O DNN é lab_slices_dnn.

uicc0 = {
  imsi = "001010000000001";
  key = "fec86ba6eb707ed08905757b1bb44b8f";
  opc = "C42449363BBAD02B66D16BC975D77CC1";
  pdu_sessions = ({ dnn = "oai"; nssai_sst = 1; nssai_sd = 0x000001; });
}
