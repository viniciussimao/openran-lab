# Configuração do nrUE do openran-lab (Etapa 1).
# A role oai_ran copia este arquivo para ~/ue.conf na VM ran; o UE roda com
# "-O ~/ue.conf". IMSI, chave e OPc são os valores de teste públicos do
# tutorial do OAI CN5G, já cadastrados no banco do core: não são segredos.
# Sem pdu_sessions o UE registra, mas não pede sessão PDU (oaitun_ue1 não sobe).
# O slice sai com o SD padrão (1.ffffff); na Etapa 2 o SD deve ser explícito.

uicc0 = {
  imsi = "001010000000001";
  key = "fec86ba6eb707ed08905757b1bb44b8f";
  opc = "C42449363BBAD02B66D16BC975D77CC1";
  pdu_sessions = ({ dnn = "oai"; nssai_sst = 1; });
}
